<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes pulseBar {
        0%, 100% { height: 40px; y: 160px; opacity: 0.7; }
        50% { height: 70px; y: 130px; opacity: 1; }
      }
      @keyframes pulseBar2 {
        0%, 100% { height: 80px; y: 120px; opacity: 0.8; }
        50% { height: 110px; y: 90px; opacity: 1; }
      }
      @keyframes pulseBar3 {
        0%, 100% { height: 50px; y: 150px; opacity: 0.6; }
        50% { height: 90px; y: 110px; opacity: 0.9; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      .animated-bg-card { animation: floatSlow 6s ease-in-out infinite; }
      .bar-1 { animation: pulseBar 4s ease-in-out infinite; }
      .bar-2 { animation: pulseBar2 3.5s ease-in-out infinite 0.5s; }
      .bar-3 { animation: pulseBar3 4.5s ease-in-out infinite 1s; }
      .flow-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Dynamic Background Elements (Pills, Charts & Flow lines) -->
  <g opacity="0.35">
    <!-- Animated Chart Bars in Right Background -->
    <rect class="bar-1" x="920" y="160" width="28" height="40" rx="4" fill="#818cf8" />
    <rect class="bar-2" x="960" y="120" width="28" height="80" rx="4" fill="#c084fc" />
    <rect class="bar-3" x="1000" y="150" width="28" height="50" rx="4" fill="#f472b6" />
    <rect class="bar-2" x="1040" y="110" width="28" height="90" rx="4" fill="#38bdf8" />
    <rect class="bar-1" x="1080" y="140" width="28" height="60" rx="4" fill="#4ade80" />

    <!-- Animated Connecting Flow Line -->
    <path class="flow-line" d="M 850 200 Q 950 120 1120 130" fill="none" stroke="url(#accentGrad)" stroke-width="3" />
    
    <!-- Floating Background Card -->
    <g class="animated-bg-card">
      <rect x="860" y="50" width="260" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <circle cx="890" cy="80" r="10" fill="#c084fc" opacity="0.8" />
      <rect x="910" y="76" width="120" height="8" rx="4" fill="#ffffff" opacity="0.5" />
      <rect x="910" y="92" width="80" height="6" rx="3" fill="#ffffff" opacity="0.3" />
    </g>

    <!-- Decorative Grid Circles -->
    <circle cx="150" cy="80" r="180" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    <circle cx="150" cy="80" r="260" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed Clear & Visible) -->
  <g transform="translate(80, 0)">
    <!-- Decorative Icon / Logo Badge -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#accentGrad)" filter="url(#glow)" />
      <!-- Document & Chart Icon -->
      <path d="M 18 16 L 32 16 L 38 22 L 38 40 C 38 42 36 44 34 44 L 18 44 C 16 44 14 42 14 40 L 14 20 C 14 18 16 16 18 16 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 20 36 L 24 30 L 28 34 L 32 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title -->
    <text x="76" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="-0.5">
      Awesome Embedded Reporting
    </text>

    <!-- Subtitle Category Tag -->
    <rect x="76" y="128" width="280" height="26" rx="13" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
    <text x="90" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#c084fc" letter-spacing="0.5">
      PIXEL-PERFECT REPORTS &amp; BI ENGINES
    </text>

    <!-- Detailed Description -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">
      Curated list of commercial SaaS platforms and open-source reporting frameworks
    </text>
    <text x="0" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">
      for embedding report designers, export engines, and paginated document generators.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="rgba(255,255,255,0.06)" />
      <text x="12" y="18" font-family="sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">⚡ SaaS &amp; Open Source</text>

      <rect x="142" y="0" width="130" height="28" rx="6" fill="rgba(255,255,255,0.06)" />
      <text x="154" y="18" font-family="sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">📄 Pixel-Perfect PDF</text>

      <rect x="284" y="0" width="140" height="28" rx="6" fill="rgba(255,255,255,0.06)" />
      <text x="296" y="18" font-family="sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">📊 Embedded Analytics</text>
    </g>
  </g>
</svg>
